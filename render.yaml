# Optional Render blueprint. Persistent disks require a paid service.
# Review the cost in Render before creating this service.
services:
  - type: web
    name: qr-link
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/links.sqlite
    disk:
      name: qr-link-data
      mountPath: /var/data
      sizeGB: 1
